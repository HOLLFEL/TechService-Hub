<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechService - Request & Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800">

    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                TechService Hub
            </h1>
            <div class="flex items-center bg-indigo-800 p-1 rounded-lg border border-indigo-600">
                <button id="btn-customer-view" onclick="switchView('customer')" class="px-4 py-1.5 rounded-md text-sm font-medium transition bg-white text-indigo-900 shadow">Customer View</button>
                <button id="btn-worker-view" onclick="switchView('worker')" class="px-4 py-1.5 rounded-md text-sm font-medium transition text-indigo-200 hover:text-white">Worker Dashboard</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">

        <div id="view-customer" class="space-y-8">
            <div class="grid md:grid-cols-3 gap-8">
                
                <div class="md:col-span-1 bg-white p-6 rounded-xl shadow-md border border-slate-200">
                    <h2 class="text-xl font-bold mb-4 text-indigo-900 border-b pb-2">Request a Service</h2>
                    <form id="requestForm" name="service-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" onsubmit="handleRequestSubmit(event)" class="space-y-4">
                        <input type="hidden" name="form-name" value="service-request">
                        <input type="hidden" name="subject" value="New Service Request: %{formName}">
                        <input type="hidden" name="ticket_id" id="ticketIdField">
                        <p class="hidden" style="display:none">
                            <label>Don't fill this out if you're human: <input name="bot-field"></label>
                        </p>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700">Full Name</label>
                            <input type="text" id="custName" name="name" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="John Doe">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700">Your Email</label>
                            <input type="email" id="custEmail" name="email" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="john@example.com">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700">Select Service Category</label>
                            <select id="serviceType" name="service_type" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                                <optgroup label="System Maintenance">
                                    <option value="Hardware Diagnostics">Hardware Diagnostics</option>
                                    <option value="OS Installation">OS Installation</option>
                                    <option value="Virus Removal">Virus Removal</option>
                                </optgroup>
                                <optgroup label="Network Services">
                                    <option value="Wi-Fi Optimization">Wi-Fi Optimization</option>
                                    <option value="Router Configuration">Router Configuration</option>
                                    <option value="Secure Networking">Secure Networking</option>
                                </optgroup>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700">Problem Description</label>
                            <textarea id="serviceDetails" name="details" rows="3" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Describe the issue..."></textarea>
                        </div>
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg shadow transition">Submit Ticket</button>
                    </form>
                </div>

                <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-md border border-slate-200">
                    <h2 class="text-xl font-bold mb-4 text-indigo-900 border-b pb-2">My Service Tickets</h2>
                    <div id="customerTicketList" class="space-y-4">
                        </div>
                </div>
            </div>
        </div>

        <div id="view-worker" class="hidden space-y-6">
            <div class="bg-indigo-900 text-white p-6 rounded-xl shadow-md flex justify-between items-center">
                <div>
                    <h2 class="text-2xl font-bold">Worker Portal</h2>
                    <p class="text-indigo-200 text-sm">Manage incoming tickets, accept jobs, and update work status.</p>
                </div>
                <div class="bg-indigo-800 px-4 py-2 rounded-lg text-xs">
                    Target Mail Receiver: <span id="targetMailReceiver" class="font-mono text-indigo-300"></span>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
                <h3 class="text-lg font-bold mb-4 text-slate-800 border-b pb-2">All Active Service Requests</h3>
                <div id="workerTicketList" class="space-y-4">
                    </div>
            </div>
        </div>

    </main>

    <script>
        // Target receiver email requested
        const RECEIVER_EMAIL = "markjosephfeliciano1@gmail.com";

        // Initial Mock Data
        let tickets = [
            {
                id: "REQ-1001",
                name: "Alex Smith",
                email: "alex@example.com",
                service: "Hardware Diagnostics",
                details: "Computer randomly shuts down under load.",
                status: "In Progress",
                workerAssigned: true,
                progress: 50
            },
            {
                id: "REQ-1002",
                name: "Maria Garcia",
                email: "maria@example.com",
                service: "Wi-Fi Optimization",
                details: "Dead zones in the back office area.",
                status: "Pending",
                workerAssigned: false,
                progress: 0
            }
        ];

        // Switch Views between Customer and Worker
        function switchView(view) {
            const customerView = document.getElementById('view-customer');
            const workerView = document.getElementById('view-worker');
            const btnCustomer = document.getElementById('btn-customer-view');
            const btnWorker = document.getElementById('btn-worker-view');

            if (view === 'customer') {
                customerView.classList.remove('hidden');
                workerView.classList.add('hidden');
                btnCustomer.className = "px-4 py-1.5 rounded-md text-sm font-medium transition bg-white text-indigo-900 shadow";
                btnWorker.className = "px-4 py-1.5 rounded-md text-sm font-medium transition text-indigo-200 hover:text-white";
            } else {
                customerView.classList.add('hidden');
                workerView.classList.remove('hidden');
                btnWorker.className = "px-4 py-1.5 rounded-md text-sm font-medium transition bg-white text-indigo-900 shadow";
                btnCustomer.className = "px-4 py-1.5 rounded-md text-sm font-medium transition text-indigo-200 hover:text-white";
            }
            render();
        }

        // Handle Customer Request Submission
        async function handleRequestSubmit(e) {
            e.preventDefault();
            const form = e.target;
            const submitBtn = form.querySelector('button[type="submit"]');

            const name = document.getElementById('custName').value;
            const email = document.getElementById('custEmail').value;
            const service = document.getElementById('serviceType').value;
            const details = document.getElementById('serviceDetails').value;

            const ticketId = "REQ-" + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('ticketIdField').value = ticketId;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            try {
                // Netlify Forms captures this submission and triggers the email
                // notification configured under Project configuration > Notifications.
                const response = await fetch('/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams(new FormData(form)).toString()
                });

                if (!response.ok) {
                    throw new Error('Form submission responded with status ' + response.status);
                }

                const newTicket = {
                    id: ticketId,
                    name,
                    email,
                    service,
                    details,
                    status: "Pending",
                    workerAssigned: false,
                    progress: 0
                };

                tickets.unshift(newTicket);
                form.reset();
                alert(`Ticket ${newTicket.id} submitted successfully! A notification has been sent to ${RECEIVER_EMAIL}.`);
                render();
            } catch (err) {
                console.error('Service request submission failed:', err);
                alert('Your ticket could not be submitted right now. Please check your connection and try again, or contact us directly.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Ticket';
            }
        }

        // Accept job by worker
        function acceptTicket(id) {
            const ticket = tickets.find(t => t.id === id);
            if (ticket) {
                ticket.status = "In Progress";
                ticket.workerAssigned = true;
                ticket.progress = 25;
                render();
            }
        }

        // Update progress by worker
        function updateProgress(id, newProgress) {
            const ticket = tickets.find(t => t.id === id);
            if (ticket) {
                ticket.progress = parseInt(newProgress);
                if (ticket.progress === 100) {
                    ticket.status = "Completed";
                } else if (ticket.progress > 0) {
                    ticket.status = "In Progress";
                }
                render();
            }
        }

        // Render UI Elements
        function render() {
            // Render Customer View
            const custList = document.getElementById('customerTicketList');
            custList.innerHTML = tickets.map(t => `
                <div class="border rounded-lg p-4 bg-slate-50 space-y-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-200">${t.id}</span>
                            <h4 class="font-bold text-slate-800 text-lg mt-1">${t.service}</h4>
                        </div>
                        <span class="text-xs px-2.5 py-1 rounded-full font-semibold ${getStatusBadge(t.status)}">${t.status}</span>
                    </div>
                    <p class="text-sm text-slate-600">${t.details}</p>
                    
                    <div class="space-y-1">
                        <div class="flex justify-between text-xs font-semibold text-slate-500">
                            <span>Work Progress</span>
                            <span>${t.progress}%</span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-2.5">
                            <div class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: ${t.progress}%"></div>
                        </div>
                    </div>
                </div>
            `).join('');

            // Render Worker View
            const workerList = document.getElementById('workerTicketList');
            workerList.innerHTML = tickets.map(t => `
                <div class="border rounded-lg p-4 bg-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <div class="space-y-1 max-w-md">
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded border border-indigo-200">${t.id}</span>
                            <span class="text-xs text-slate-500 font-medium">Customer: ${t.name} (${t.email})</span>
                        </div>
                        <h4 class="font-bold text-slate-800">${t.service}</h4>
                        <p class="text-sm text-slate-600">${t.details}</p>
                    </div>

                    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3 w-full md:w-auto">
                        ${!t.workerAssigned ? `
                            <button onclick="acceptTicket('${t.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow transition w-full sm:w-auto">
                                Accept Job
                            </button>
                        ` : `
                            <div class="flex items-center gap-2 w-full sm:w-auto">
                                <label class="text-xs font-semibold text-slate-600">Progress:</label>
                                <select onchange="updateProgress('${t.id}', this.value)" class="p-2 border rounded-lg text-sm bg-white font-medium focus:ring-2 focus:ring-indigo-500">
                                    <option value="25" ${t.progress === 25 ? 'selected' : ''}>25% - Started</option>
                                    <option value="50" ${t.progress === 50 ? 'selected' : ''}>50% - In Progress</option>
                                    <option value="75" ${t.progress === 75 ? 'selected' : ''}>75% - Testing</option>
                                    <option value="100" ${t.progress === 100 ? 'selected' : ''}>100% - Completed</option>
                                </select>
                            </div>
                        `}
                    </div>
                </div>
            `).join('');
        }

        function getStatusBadge(status) {
            switch(status) {
                case 'Pending': return 'bg-amber-100 text-amber-800 border border-amber-300';
                case 'In Progress': return 'bg-blue-100 text-blue-800 border border-blue-300';
                case 'Completed': return 'bg-emerald-100 text-emerald-800 border border-emerald-300';
                default: return 'bg-slate-100 text-slate-800';
            }
        }

        // Initial Render
        document.getElementById('targetMailReceiver').textContent = RECEIVER_EMAIL;
        render();
    </script>
</body>
</html>
